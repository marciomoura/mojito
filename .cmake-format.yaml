# Basic formatting options
format:
  # Maximum line length before wrapping
  line_width: 80

  # Number of spaces for each indentation level
  tab_size: 4

  # If false, uses spaces instead of tabs for indentation
  use_tabchars: false

  # Maximum number of subgroups in a line before wrapping
  # Example with max_subgroups_hwrap: 2
  # Good:
  #   add_library(mylib
  #     STATIC
  #     source1.cpp source2.cpp)
  # Bad (will wrap):
  #   add_library(mylib STATIC source1.cpp source2.cpp)
  max_subgroups_hwrap: 2

  # Maximum number of positional arguments in a line before wrapping
  # Example with max_pargs_hwrap: 3
  # Good:
  #   set(SOURCES a.cpp b.cpp c.cpp)
  # Bad (will wrap):
  #   set(SOURCES a.cpp b.cpp c.cpp d.cpp)
  max_pargs_hwrap: 3

  # Controls alignment of wrapped lines
  dangle_parens: false # If true, closing parenthesis gets its own line

  # Spacing between command and first argument
  separate_ctrl_name_with_space: false # add_library (mylib) vs add_library(mylib)

  # Spacing before/after parentheses
  separate_fn_name_with_space: false # function (foo) vs function(foo)

  # Line ending style
  line_ending: unix # or 'windows'

  # Command case style
  command_case: lower # or 'upper', 'canonical'

  # Keyword case style
  keyword_case: upper # or 'lower', 'unchanged'

# Layout configuration
layout:
  # Group similar commands together
  enable_sort: true

  # Autogenerated comment placement
  autosort: false # Automatically sort command arguments

# Command configurations
markup:
  # Enables special comment markup for formatting
  # Example:
  # # ---- Section Name ----
  enable_markup: true

# Comment formatting
parse:
  # Define custom commands and their expected arguments
  additional_commands:
    foo: # Custom command name
      flags: # Optional flags the command accepts
        - BAR
        - BAZ
      kwargs: # Keyword arguments with their value patterns
        HEADERS: "*" # * means any number of values
        SOURCES: "*"
        DEPENDS: "*"

# Global settings
# Enables formatting of comment blocks
enable_markup: true

# If true, the first comment in a file is kept exactly as-is
first_comment_is_literal: true

# Regex pattern for comments that should be treated as literal
# null means no pattern (disabled)
literal_comment_pattern: null
