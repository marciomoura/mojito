# ------------------------------------------------------------------------------
# cmake-format configuration
# ------------------------------------------------------------------------------

# How to format the code
format:
  line_width: 120 # Increased for modern screens
  tab_size: 4
  use_tabchars: false
  fractional_tab_policy: round
  
  # Wrapping logic
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  max_rows_cmdline: 2
  
  # Parentheses and spacing
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  dangle_parens: true # Modern style: put closing parens on their own line
  dangle_align: prefix
  min_pargs_to_dangle: 2
  
  # Cases
  command_case: lower
  keyword_case: upper
  
  # Line endings
  line_ending: unix

# Layout configuration
layout:
  # Enable sorting of arguments in commands like set()
  enable_sort: true
  # Do not automatically sort arguments that might be order-dependent
  autosort: false

# Parse configuration
parse:
  # Define custom command behaviors to help the formatter understand the structure
  additional_commands:
    target_sources:
      kwargs:
        PUBLIC: "*"
        PRIVATE: "*"
        INTERFACE: "*"
        FILE_SET: "*"
        BASE_DIRS: "*"
        FILES: "*"
    target_include_directories:
      kwargs:
        PUBLIC: "*"
        PRIVATE: "*"
        INTERFACE: "*"
    target_link_libraries:
      kwargs:
        PUBLIC: "*"
        PRIVATE: "*"
        INTERFACE: "*"
    fetchcontent_declare:
      kwargs:
        URL: "*"
        URL_HASH: "*"
        GIT_REPOSITORY: "*"
        GIT_TAG: "*"
        SYSTEM: 0
        EXCLUDE_FROM_ALL: 0

# Markup configuration (comments)
markup:
  enable_markup: true
  first_comment_is_literal: true
  literal_comment_pattern: "^# ---"
