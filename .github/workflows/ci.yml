# Name of the workflow that appears in GitHub Actions
name: CI

# Workflow version: 1.0 - Initial mojito CI

# Define when this workflow will run
on:
  pull_request:
  push:
    branches: [main, master, develop, feature/bazel-support]
  workflow_dispatch:

jobs:
  # Job 1: Build
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [clang, gcc]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: cmake ninja-build clang gcc g++ ccache mold llvm cppcheck
          version: 1.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.compiler }}-ccache
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-
            ${{ runner.os }}-
          max-size: 500M
          verbose: 2

      - name: Set compiler variables
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi

      - name: Configure CMake project
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_C_COMPILER=$CC \
                -DCMAKE_CXX_COMPILER=$CXX \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DMOJITO_BUILD_TESTING=ON \
                -DMOJITO_ENABLE_CCACHE=ON \
                -DMOJITO_ENABLE_CPPCHECK=ON 
          echo "=== CMake Configuration Complete ==="

      - name: Build all targets
        run: |
          echo "=== Starting Build at $(date) ==="
          time cmake --build build --parallel $(nproc)
          echo "=== Build Complete at $(date) ==="

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.compiler }}
          path: |
            build/bin/
          retention-days: 3
          compression-level: 9

  # Job 2: Unit Tests & Examples
  test-unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [clang, gcc]
      fail-fast: false
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.compiler }}
          path: build/bin/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run unit tests
        run: |
          echo "=== Running Unit Tests with ${{ matrix.compiler }} ==="
          ./build/bin/mojito_tests --gtest_color=yes

      - name: Run examples
        run: |
          echo "=== Running Examples with ${{ matrix.compiler }} ==="
          ./build/bin/examples_frames
          ./build/bin/example_operators
          ./build/bin/example_rotation
          ./build/bin/example_unit_conversion
          
  # Job 3: Bazel Build & Test
  bazel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', '**/MODULE.bazel', '.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-version: "1.19.0"

      - name: Build and Test with Bazel
        run: |
          bazel test //mojito:mojito //mojito/tests:mojito_tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
