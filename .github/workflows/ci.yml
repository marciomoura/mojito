name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop, feature/bazel-support]
  workflow_dispatch:

jobs:
  bazel:
    name: Bazel Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          # Free up ~20GB of disk space to ensure LLVM extraction succeeds
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Mount Bazel Repository Cache
        uses: actions/cache@v4
        with:
          path: ~/.bazel-repo-cache
          key: bazel-repo-cache-${{ hashFiles('**/MODULE.bazel') }}
          restore-keys: |
            bazel-repo-cache-

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-version: "1.19.0"

      - name: Build and Test
        run: |
          # Move output base to current workspace to utilize freed disk space
          bazel --output_user_root=$GITHUB_WORKSPACE/.bazel-root test //...

  cmake:
    name: CMake Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DMOJITO_BUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: |
          cd build
          ctest --output-on-failure

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
