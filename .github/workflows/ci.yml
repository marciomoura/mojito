name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop, feature/bazel-support]
  workflow_dispatch:

jobs:
  bazel:
    name: Bazel ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [native, arm64, m4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install libtinfo5 for LLVM compatibility
          sudo apt-get update
          sudo apt-get install -y libtinfo5

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ matrix.config }}-${{ hashFiles('**/BUILD.bazel', '**/MODULE.bazel', '.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.config }}-

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-version: "1.19.0"

      - name: Build and Test
        run: |
          if [ "${{ matrix.config }}" = "native" ]; then
            # Run full test suite for native host
            bazel test //...
          elif [ "${{ matrix.config }}" = "arm64" ]; then
            # Cross-compile for ARM64 Linux
            bazel build --config=arm64 //...
          elif [ "${{ matrix.config }}" = "m4" ]; then
            # Cross-compile for Cortex-M4 (Bare Metal)
            bazel build --config=m4 //...
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
